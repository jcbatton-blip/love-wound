<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book the Mirror Session · Jeff Batton</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Book your Mirror Session with Jeff Batton. 60 minutes, one-to-one, by video or in-person.">
<link rel="canonical" href="https://jeffbatton.com/book">
<meta property="og:title" content="Book the Mirror Session · Jeff Batton">
<meta property="og:description" content="60 minutes. One pattern. Traced to its root. Clarity you can act on — same day.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jeffbatton.com/book">
<meta property="og:image" content="https://jeffbatton.com/assets/og-mirror.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/monogram.svg" type="image/svg+xml">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg-paper);scroll-behavior:smooth}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  header.site {
    position:sticky;top:0;z-index:20;
    padding:18px 48px;display:flex;align-items:center;justify-content:space-between;
    background:rgba(20,17,15,.72);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-on-dark);
    color:var(--cream-50);
  }
  header.site .logo{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
  header.site .logo .name{font-family:var(--font-display);font-style:italic;font-size:17px;line-height:1}
  header.site .logo .tag{font-family:var(--font-body);font-size:8px;letter-spacing:.28em;opacity:.7;margin-top:3px}
  header.site .back{
    font-family:var(--font-body);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold);
    padding:4px 0;transition:opacity .2s;
  }
  header.site .back:hover{opacity:.8}

  .intro{
    max-width:720px;margin:0 auto;padding:72px 32px 32px;text-align:center;
  }
  .intro .eyebrow{
    font-family:var(--font-body);font-size:12px;font-weight:500;
    text-transform:uppercase;letter-spacing:.32em;color:var(--accent);
    margin-bottom:20px;
  }
  .intro h1{
    font-family:var(--font-display);font-weight:400;
    font-size:clamp(40px,5.5vw,64px);line-height:1.04;letter-spacing:-.02em;
    margin:0 0 20px;color:var(--fg-1);text-wrap:balance;
  }
  .intro h1 em{font-style:italic;color:var(--accent)}
  .intro p{
    font-family:var(--font-display);font-style:italic;font-size:20px;line-height:1.5;
    color:var(--fg-2);max-width:540px;margin:0 auto;
  }

  .embed-wrap{
    max-width:1040px;margin:24px auto 72px;padding:0 16px;
  }
  .calendly-inline-widget{
    min-width:320px;height:780px;width:100%;
    background:var(--bg-paper);
  }

  footer.site{
    background:var(--charcoal-950);color:var(--cream-200);
    padding:48px 48px 28px;
  }
  footer.site .grid{
    max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
  }
  footer.site .brand{display:flex;align-items:center;gap:14px;color:var(--cream-50);text-decoration:none}
  footer.site .brand .name{font-family:var(--font-display);font-style:italic;font-size:18px;line-height:1}
  footer.site .brand .tag{font-family:var(--font-body);font-size:9px;letter-spacing:.28em;opacity:.7;margin-top:4px}
  footer.site .rule{
    max-width:1120px;margin:32px auto 0;padding-top:20px;
    border-top:1px solid var(--line-on-dark);
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    font-family:var(--font-body);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--charcoal-400);
  }

  @media (max-width:900px){
    header.site{padding:16px 24px}
    .intro{padding:56px 20px 24px}
    .calendly-inline-widget{height:900px}
    footer.site{padding:36px 24px 24px}
    footer.site .rule{flex-direction:column;text-align:center}
  }
</style>
</head>
<body data-screen-label="Book Page">

<header class="site">
  <a class="logo" href="/" aria-label="Jeff Batton Life Coaching">
    <img src="assets/monogram.svg" alt="" style="height:30px;filter:invert(1) sepia(.3)">
    <div>
      <div class="name">Jeff Batton</div>
      <div class="tag">LIFE COACHING</div>
    </div>
  </a>
  <a class="back" href="/">← Back</a>
</header>

<section class="intro">
  <div class="eyebrow">Book · the Mirror Session</div>
  <h1>Pick a time. <em>Come as you are.</em></h1>
  <p>Sixty minutes, one-to-one, by video or in-person. $250 · single session · no upsell.</p>
</section>

<section class="embed-wrap">
  <div class="calendly-inline-widget"
       data-url="https://calendly.com/d/cxkw-gzv-8kv?hide_gdpr_banner=1"
       style="min-width:320px;height:780px;"></div>
  <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
  <noscript>
    <p style="text-align:center;font-family:var(--font-body);color:var(--fg-2);padding:32px">
      Enable JavaScript to load the scheduler, or
      <a href="https://calendly.com/d/cxkw-gzv-8kv">book directly on Calendly</a>.
    </p>
  </noscript>
</section>

<footer class="site">
  <div class="grid">
    <a class="brand" href="/">
      <img src="assets/monogram.svg" alt="" style="height:30px;filter:invert(1) sepia(.3)">
      <div>
        <div class="name">Jeff Batton</div>
        <div class="tag">LIFE COACHING</div>
      </div>
    </a>
    <a class="back" href="/" style="font-family:var(--font-body);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--gold);padding-bottom:4px">← Back to home</a>
  </div>
  <div class="rule">
    <span>© Jeff Batton Life Coaching LLC</span>
    <span>Simple · Sexy · Southern · Sophisticated</span>
  </div>
</footer>

</body>
</html>

[build]
  command = "rm -rf dist && mkdir -p dist/images && cp index.html freedom.css dist/ && cp -R blog dist/ && cp sitemap.xml robots.txt dist/ && cp book.html weekend.html dist/ && cp client-portal.html dist/ && cp library.html dist/ && cp privacy.html dist/ && cp terms.html dist/ && cp colors_and_type.css site-updates.css dist/ && cp -R assets dist/ && cp images/jeffrey-batton-hero.jpeg dist/images/ && cp images/jeffrey-crowd.jpeg dist/images/ && cp images/jeffrey-chair.mp4 dist/images/ && cp images/headshot.jpg dist/images/ && echo 'Build complete'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "https://www.jeffbatton.com/*"
  to = "https://jeffbatton.com/:splat"
  status = 301
  force = true

# Former /mirror-session route now lives at site root. 301 any inbound links home.
[[redirects]]
  from = "/mirror-session"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/mirror-session.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/mirror-session/*"
  to = "/"
  status = 301
  force = true

# Pretty URLs for legal pages (JBLC-017)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Syllabus and booking routes must resolve before the catch-all.
[[redirects]]
  from = "/syllabus"
  to = "/library.html"
  status = 200
  force = true

[[redirects]]
  from = "/library"
  to = "/syllabus"
  status = 301
  force = true

[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

[[redirects]]
  from = "/weekend"
  to = "/weekend.html"
  status = 200

# SPA fallback — only fires if the requested file doesn't exist on disk.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

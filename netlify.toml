[build]
  command = "pnpm install --no-frozen-lockfile && pnpm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.4.1"

# Canonical domain: www → apex
[[redirects]]
  from = "https://www.jeffbatton.com/*"
  to = "https://jeffbatton.com/:splat"
  status = 301
  force = true

# Preserve legacy client portal
[[redirects]]
  from = "/client-portal"
  to = "/client-portal.html"
  status = 200

# SPA fallback — any unknown route serves index.html so the React app renders
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "rm -rf dist && mkdir -p dist/images && cp index.html freedom.css dist/ && cp -R blog dist/ && cp sitemap.xml robots.txt dist/ && cp book.html weekend.html contact.html thank-you.html contact.js support.css dist/ && cp client-portal.html portal-admin.html portal-admin.js portal.css dist/ && ./node_modules/.bin/esbuild client-portal.js --bundle --platform=browser --format=esm --outfile=dist/client-portal.js && cp library.html dist/ && cp privacy.html dist/ && cp terms.html dist/ && cp colors_and_type.css site-updates.css dist/ && cp -R assets dist/ && cp images/jeffrey-batton-hero.jpeg dist/images/ && cp images/jeffrey-crowd.jpeg dist/images/ && cp images/jeffrey-chair.mp4 dist/images/ && cp images/headshot.jpg dist/images/ && echo 'Build complete'"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://www.jeffbatton.com/*"
  to = "https://jeffbatton.com/:splat"
  status = 301
  force = true

# Former /mirror-session route now lives at site root. 301 any inbound links home.
[[redirects]]
  from = "/mirror-session"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/mirror-session.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/mirror-session/*"
  to = "/"
  status = 301
  force = true

# Pretty URLs for legal pages (JBLC-017)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Syllabus and booking routes must resolve before the catch-all.
[[redirects]]
  from = "/syllabus"
  to = "/library.html"
  status = 200
  force = true

[[redirects]]
  from = "/library"
  to = "/syllabus"
  status = 301
  force = true

[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

[[redirects]]
  from = "/weekend"
  to = "/weekend.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/client-portal"
  to = "/client-portal.html"
  status = 200

[[redirects]]
  from = "/portal-admin"
  to = "/portal-admin.html"
  status = 200

[[headers]]
  for = "/client-portal*"
  [headers.values]
    Cache-Control = "no-store, private"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/portal-admin*"
  [headers.values]
    Cache-Control = "no-store, private"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# SPA fallback — only fires if the requested file doesn't exist on disk.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
